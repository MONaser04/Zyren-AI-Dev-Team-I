calibration_config:
  min_kappa: 0.6
  target_agreement: 0.8
  categories: ["correctness", "code_quality", "documentation", "error_handling"]
  score_scale: "1-10"  # Will be normalized to 0-1
  judge_model: "critic"  # Different model family from coder
  num_calibration_rounds: 3
  randomize_order: true