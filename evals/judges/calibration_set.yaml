      code_quality: 4  # No generics, no error handling
      documentation: 2
      error_handling: 2
    expected_verdict: "FAIL"
    notes: "Missing generics, type hints, error handling"

  - id: "cal_quality_03"
    category: "code_quality"
    task_description: "Write a FastAPI app with POST /users and GET /users/{id}."
    code: |
      from fastapi import FastAPI, HTTPException
      from pydantic import BaseModel
      from typing import Dict

      app = FastAPI()
      users: Dict[int, dict] = {}
      counter = 0

      class UserCreate(BaseModel):
          name: str
          email: str

      class User(UserCreate):
          id: int

      @app.post("/users", response_model=User, status_code=201)
      def create_user(user: UserCreate):
          global counter
          counter += 1
          u = User(id=counter, **user.model_dump())
          users[counter] = u
          return u

      @app.get("/users/{user_id}", response_model=User)
      def get_user(user_id: int):
          if user_id not in users:
              raise HTTPException(404, "User not found")
          return users[user_id]
    human_scores:
      correctness: 10
      code_quality: 9
      documentation: 7
      error_handling: 9
    expected_verdict: "PASS"
    notes: "Well-structured FastAPI, good validation"

  # ── Category: DOCUMENTATION (التوثيق؟) ─────────────────────────
  - id: "cal_doc_01"
    category: "documentation"
    task_description: "Write a function with full docstring, type hints, and 3 tests."
    code: |
      def fibonacci(n: int) -> int:
          """
          Return the n-th Fibonacci number (iterative).
          
          Args:
              n: Non-negative integer index.
          
          Returns:
              The n-th Fibonacci number (0-indexed: fib(0)=0, fib(1)=1).
          
          Raises:
              ValueError: If n is negative.
          
          Examples:
              >>> fibonacci(0)
              0
              >>> fibonacci(5)
              5
          """
          if n < 0:
              raise ValueError("n must be non-negative")
          a, b = 0, 1
          for _ in range(n):
              a, b = b, a + b
          return a

      assert fibonacci(0) == 0
      assert fibonacci(1) == 1
      assert fibonacci(5) == 5
    human_scores:
      correctness: 10
      code_quality: 9
      documentation: 10
      error_handling: 9
    expected_verdict: "PASS"
    notes: "Excellent docstring with args, returns, raises, examples"

