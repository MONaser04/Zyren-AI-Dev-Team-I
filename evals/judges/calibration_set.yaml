  # ── Category: ERROR_HANDLING (معالجة الأخطاء؟) ─────────────────────────
  - id: "cal_error_01"
    category: "error_handling"
    task_description: "Write fetch_json(url: str) -> dict with retry (3x), timeout, error handling."
    code: |
      import aiohttp
      import asyncio
      from typing import Dict

      async def fetch_json(url: str) -> Dict:
          """
          Fetch JSON from URL with retry and error handling.
          
          Args:
              url: The URL to fetch.
          
          Returns:
              Parsed JSON response as dict.
          
          Raises:
              aiohttp.ClientError: On connection/HTTP errors after retries.
              ValueError: If response is not valid JSON.
          """
          timeout = aiohttp.ClientTimeout(total=10)
          async with aiohttp.ClientSession(timeout=timeout) as session:
              for attempt in range(3):
                  try:
                      async with session.get(url) as resp:
                          resp.raise_for_status()
                          return await resp.json()
                  except (aiohttp.ClientError, asyncio.TimeoutError) as e:
                      if attempt == 2:
                          raise
                      await asyncio.sleep(2 ** attempt)
      # Tests would be in separate test file
    human_scores:
      correctness: 10
      code_quality: 9
      documentation: 9
      error_handling: 10
    expected_verdict: "PASS"
    notes: "Proper retry, timeout, specific exceptions, good docstring"

