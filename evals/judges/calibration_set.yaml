# Calibration Set for LLM-as-Judge
# ============================================================
# يدوياً: 30-50 مهمة مع تسميات بشرية ذهبية (human labels)
# يستخدم لمعايرة القاضي حتى يصل Cohen's κ ≥ 0.6
# ============================================================

calibration_tasks:
  # ── Category: CORRECTNESS (الخوارزمية صحيحة؟) ─────────────────────────
  - id: "cal_correct_01"
    category: "correctness"
    task_description: "Write a function fibonacci(n: int) -> int that returns the n-th Fibonacci number iteratively."
    code: |
      def fibonacci(n: int) -> int:
          """Return the n-th Fibonacci number (iterative)."""
          if n < 0:
              raise ValueError("n must be non-negative")
          a, b = 0, 1
          for _ in range(n):
              a, b = b, a + b
          return a
    human_scores:
      correctness: 10
      code_quality: 9
      documentation: 8
      error_handling: 9
    expected_verdict: "PASS"
    notes: "Correct, well-documented, handles edge case"

  - id: "cal_correct_02"
    category: "correctness"
    task_description: "Write a function fibonacci(n: int) -> int that returns the n-th Fibonacci number iteratively."
    code: |
      def fibonacci(n: int) -> int:
          if n <= 1:
              return n
          return fibonacci(n-1) + fibonacci(n-2)  # Recursive - WRONG per spec
    human_scores:
