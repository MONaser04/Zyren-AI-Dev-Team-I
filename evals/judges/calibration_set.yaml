  # ── Category: CODE_QUALITY (جودة الكود؟) ─────────────────────────
  - id: "cal_quality_01"
    category: "code_quality"
    task_description: "Create a Stack[T] generic class with push, pop, peek, is_empty."
    code: |
      from typing import Generic, TypeVar, List
      T = TypeVar('T')

      class Stack(Generic[T]):
          def __init__(self):
              self._items: List[T] = []
          def push(self, item: T) -> None:
              self._items.append(item)
          def pop(self) -> T:
              if not self._items:
                  raise IndexError("pop from empty stack")
              return self._items.pop()
          def peek(self) -> T:
              if not self._items:
                  raise IndexError("peek from empty stack")
              return self._items[-1]
          def is_empty(self) -> bool:
              return len(self._items) == 0
    human_scores:
      correctness: 10
      code_quality: 10
      documentation: 6
      error_handling: 10
    expected_verdict: "PASS"
    notes: "Clean, generic, proper errors, minor doc gap"

  - id: "cal_quality_02"
    category: "code_quality"
    task_description: "Create a Stack[T] generic class with push, pop, peek, is_empty."
    code: |
      class Stack:
          def __init__(self):
              self.items = []
          def push(self, item):
              self.items.append(item)
          def pop(self):
              return self.items.pop()
          def peek(self):
              return self.items[-1]
          def is_empty(self):
              return len(self.items) == 0
    human_scores:
