  # ── Mixed/Edge Cases ─────────────────────────
  - id: "cal_mixed_01"
    category: "mixed"
    task_description: "Implement a rate limiter with sliding window."
    code: |
      import time
      from collections import deque
      from threading import Lock
      from typing import Dict

      class RateLimiter:
          def __init__(self, max_requests: int, window_seconds: float):
              self.max_requests = max_requests
              self.window_seconds = window_seconds
              self._requests: Dict[str, deque] = {}
              self._lock = Lock()

          def allow_request(self, client_id: str) -> bool:
              now = time.monotonic()
              with self._lock:
                  if client_id not in self._requests:
                      self._requests[client_id] = deque()
                  dq = self._requests[client_id]
                  # Remove old entries
                  while dq and dq[0] <= now - self.window_seconds:
                      dq.popleft()
                  if len(dq) < self.max_requests:
                      dq.append(now)
                      return True
                  return False

          def reset(self, client_id: str) -> None:
              with self._lock:
                  if client_id in self._requests:
                      self._requests[client_id].clear()
    human_scores:
      correctness: 10
      code_quality: 9
      documentation: 6
      error_handling: 8
    expected_verdict: "PASS"
    notes: "Thread-safe, sliding window correct, minor doc gap"

