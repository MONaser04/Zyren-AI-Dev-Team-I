# ============================================================
# AI Dev-Team — Golden Task Set
# ============================================================
# Curated coding tasks for day-one evaluation.
# Add 10–20 real tasks BEFORE writing any agent code.
#
# Schema per task:
#   id, title, description, language, difficulty, tags,
#   input (files + instructions), expected (tests, types, lint)
# ============================================================

tasks:
  # ----------------------------------------------------------
  # Template 1: Bug Fix (Easy)
  # ----------------------------------------------------------
  - id: "golden-001"
    title: "Fix off-by-one error in pagination"
    description: |
      The `paginate()` function returns one fewer item than expected
      on the last page. Fix the boundary condition.
    language: "python"
    difficulty: "easy"
    tags: ["bugfix", "boundary"]
    input:
      instructions: |
        The paginate function in utils.py has an off-by-one error.
        The last page should include the remaining items but currently
        drops the final item. Fix it.
      files:
        "utils.py": |
          def paginate(items: list, page: int, size: int) -> list:
              start = page * size
              end = start + size - 1  # BUG: should be start + size
              return items[start:end]
    expected:
      tests_pass: true
      type_check: true
      lint_clean: true

  # ----------------------------------------------------------
  # Template 2: Refactoring (Medium)
  # ----------------------------------------------------------
  - id: "golden-002"
    title: "Extract validation logic into separate function"
    description: |
      The `process_order()` function has inline validation logic
      that should be extracted into a `validate_order()` function
      for reusability and testability.
    language: "python"
    difficulty: "medium"
    tags: ["refactor", "clean-code"]
    input:
      instructions: |
        Extract the validation logic from process_order() into a
        separate validate_order() function. Ensure all existing
        tests still pass.
      files: {}
    expected:
      tests_pass: true
      type_check: true
      lint_clean: true

  # ----------------------------------------------------------
  # Template 3: Feature Addition (Medium)
  # ----------------------------------------------------------
  - id: "golden-003"
    title: "Add --verbose flag to CLI tool"
    description: |
      Add a --verbose / -v flag to the CLI that enables detailed
      output logging. When not set, only errors should be printed.
    language: "python"
    difficulty: "medium"
    tags: ["feature", "cli"]
    input:
      instructions: |
        Add a --verbose flag using argparse. When enabled, print
        debug-level information. Default behavior is quiet mode.
      files: {}
    expected:
      tests_pass: true
      type_check: true
      lint_clean: true

  # ----------------------------------------------------------
  # Template 4: Test Writing (Easy)
  # ----------------------------------------------------------
  - id: "golden-004"
    title: "Write unit tests for string utility module"
    description: |
      The string_utils module has no tests. Write comprehensive
      pytest tests covering edge cases (empty string, unicode,
      special characters).
    language: "python"
    difficulty: "easy"
    tags: ["testing", "pytest"]
    input:
      instructions: |
        Write pytest unit tests for all functions in string_utils.py.
        Cover: normal cases, edge cases, error cases.
      files: {}
    expected:
      tests_pass: true
      type_check: true
      lint_clean: true

  # ----------------------------------------------------------
  # Template 5: Data Processing (Hard)
  # ----------------------------------------------------------
  - id: "golden-005"
    title: "Parse and normalize nested JSON API response"
    description: |
      Write a function that takes a deeply nested JSON API response
      and flattens it into a list of normalized records suitable
      for database insertion.
    language: "python"
    difficulty: "hard"
    tags: ["data", "json", "transformation"]
    input:
      instructions: |
        Implement flatten_api_response() that handles:
        - Nested objects (dot notation keys)
        - Arrays (one record per array item)
        - Null/missing fields (default values)
        - Type coercion (strings to dates, numbers)
      files: {}
    expected:
      tests_pass: true
      type_check: true
      lint_clean: true

