name: CI — Lint, Type-Check, Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install ruff
      - run: ruff check src/ tests/ --output-format=github
      - run: ruff format --check src/ tests/

  typecheck:
    name: 🔏 Type-Check (MyPy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: mypy --config-file pyproject.toml

  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      TESTING: "1"
      # Block all real API calls in tests
      OPENAI_API_KEY: "test-key-do-not-use"
      NVIDIA_API_KEY: "test-key-do-not-use"
      ANTHROPIC_API_KEY: "test-key-do-not-use"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run unit tests (no real API calls)
        run: |
          python -m pytest tests/ \
            -v --tb=short \
            -k "not integration and not e2e" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  test-integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    env:
      TESTING: "1"
      OPENAI_API_KEY: "test-key-do-not-use"
      NVIDIA_API_KEY: "test-key-do-not-use"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run integration tests (mock APIs only)
        run: |
          python -m pytest tests/ \
            -v --tb=short \
            -k "integration" \
            --timeout=120

  verify-zero-api-calls:
    name: 🛡️ Verify Zero Real API Calls
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Check for real API calls in test code
        run: |
          echo "Scanning for real API calls in tests..."
          # Should NOT find any real litellm.acompletion or httpx.get to provider URLs
          if grep -rn "litellm.acompletion\|litellm.completion" tests/ | grep -v "mock\|patch\|Mock\|fixture"; then
            echo "❌ Found unguarded litellm calls in tests!"
            exit 1
          fi
          echo "✅ No real API calls detected in tests."
